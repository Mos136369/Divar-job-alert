name: Divar Job Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  divar-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install requests
        run: pip install requests

      - name: Search Divar and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "110744941"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import requests

          API = "https://api.divar.ir/v8/postlist/w/search"

          # تهران + شیراز
          CITIES = ["1", "5"]

          # کلمات موردنظر
          KEYWORDS = [
              "excel", "اکسل",
              "vba",
              "power query",
              "powerquery",
              "power bi", "powerbi",
              "python", "پایتون",
              "automation", "اتوماسیون",
              "rpa",
              "ai", "هوش مصنوعی",
              "data analyst", "data analysis",
              "تحلیل داده",
              "داده",
              "برنامه نویسی", "برنامه‌نویسی",
          ]

          STATE_FILE = "seen_ads.json"
          MAX_PAGES = 3
          MAX_FIRST_ALERTS = 10

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/json",
              "Origin": "https://divar.ir",
              "Referer": "https://divar.ir/"
          }

          def normalize(text):
              text = str(text or "").lower()
              text = text.replace("ي", "ی").replace("ك", "ک")
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def matches(text):
              text = normalize(text)
              return any(normalize(k) in text for k in KEYWORDS)

          def load_seen():
              if not os.path.exists(STATE_FILE):
                  return set()
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      return set(json.load(f))
              except Exception:
                  return set()

          def save_seen(seen):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(sorted(seen), f, ensure_ascii=False, indent=2)

          def telegram(message):
              url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
              r = requests.post(
                  url,
                  data={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": message,
                      "disable_web_page_preview": False
                  },
                  timeout=30
              )
              r.raise_for_status()

          def search_city(city):
              pagination = {
                  "@type": "type.googleapis.com/post_list.PaginationData",
                  "page": 1
              }

              found = []

              for _ in range(MAX_PAGES):
                  payload = {
                      "city_ids": [city],
                      "pagination_data": pagination,
                      "search_data": {
                          "form_data": {
                              "data": {
                                  "category": {
                                      "str": {"value": "jobs"}
                                  }
                              }
                          }
                      }
                  }

                  r = requests.post(API, json=payload, headers=headers, timeout=30)
                  r.raise_for_status()
                  data = r.json()

                  for widget in data.get("list_widgets", []):
                      if widget.get("widget_type") != "POST_ROW":
                          continue

                      d = widget.get("data", {})
                      action = d.get("action", {}).get("payload", {})
                      token = action.get("token")

                      if not token:
                          continue

                      title = d.get("title", "")
                      text_parts = [
                          title,
                          d.get("middle_description_text", ""),
                          d.get("bottom_description_text", ""),
                          d.get("description", "")
                      ]

                      combined = " ".join(str(x) for x in text_parts)

                      if not matches(combined):
                          continue

                      web_info = action.get("web_info", {})

                      found.append({
                          "token": token,
                          "title": title,
                          "city": web_info.get("city_persian", ""),
                          "district": web_info.get("district_persian", ""),
                          "url": f"https://divar.ir/v/{token}"
                      })

                  p = data.get("pagination", {})
                  if not p.get("has_next_page"):
                      break

                  next_data = p.get("data")
                  if not next_data:
                      break

                  pagination = next_data

              return found

          seen = load_seen()
          all_ads = {}

          for city in CITIES:
              try:
                  for ad in search_city(city):
                      all_ads[ad["token"]] = ad
              except Exception as e:
                  print(f"City {city} error: {e}")

          print("Matching ads:", len(all_ads))

          new_ads = [ad for token, ad in all_ads.items() if token not in seen]

          # بار اول: فقط 10 مورد آخر ارسال شود تا تلگرام بمباران نشود
          first_run = not os.path.exists(STATE_FILE)

          if first_run:
              send_ads = new_ads[:MAX_FIRST_ALERTS]
          else:
              send_ads = new_ads

          for ad in send_ads:
              location = " - ".join(
                  x for x in [ad["city"], ad["district"]] if x
              )

              message = (
                  "🔔 آگهی استخدام جدید دیوار\n\n"
                  f"💼 {ad['title']}\n"
                  f"📍 {location or 'نامشخص'}\n\n"
                  f"🔗 {ad['url']}"
              )

              try:
                  telegram(message)
                  print("Sent:", ad["token"])
              except Exception as e:
                  print("Telegram error:", e)

          # همه آگهی‌های دیده‌شده ثبت می‌شوند تا تکراری ارسال نشوند
          seen.update(all_ads.keys())
          save_seen(seen)

          print("Seen ads:", len(seen))
          print("New ads:", len(new_ads))
          print("Sent:", len(send_ads))
          PY

      - name: Save seen ads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_ads.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update seen Divar ads"
            git push
          fi
